name: happy_bee
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: 14.0.0
  camera: ^0.11.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/logo/app_icon.png"
  adaptive_icon_background: "#6F9FAF"
  adaptive_icon_foreground: "assets/brand/logo/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo/

  fonts:
    - family: LouisGeorgeCafe
      fonts:
        - asset: assets/brand/typography/Louis George Cafe Bold.ttf
          weight: 700
    - family: Heatwood
      fonts:
        - asset: assets/brand/typography/Heatwood.ttf
